# Vale prose lint for Merlon shards. Run: npm run docs:vale:sync (once), then npm run docs:prose
StylesPath = styles
MinAlertLevel = suggestion

Packages = Microsoft

[*.{md,mdx}]
BasedOnStyles = Microsoft, MerlonDocs
TokenIgnores = \[(?:\\.|[^\[\]\\]|\[(?:\\.|[^\[\]\\])*\])*\]\([^)]*\)

Microsoft.Adverbs = NO
Microsoft.FirstPerson = NO
Microsoft.We = NO
Microsoft.SentenceLength = NO
Microsoft.HeadingPunctuation = NO
Microsoft.Contractions = NO
Microsoft.Dashes = NO
Microsoft.Terms = NO

MerlonDocs.DatedClaim = warning
